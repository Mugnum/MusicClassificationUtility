[project]
name = "music-classification-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "timm==0.9.16",
    "sacred==0.8.7",
    # Sacred imports pkg_resources, removed by newer setuptools releases.
    "setuptools==80.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
